<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings Memory Game</title>
  <link rel="shortcut icon" href="/assets/img/memory-game.png" type="image/x-icon" />
  <link rel="stylesheet" href="./src/styles/entries/global.scss" />
  <link rel="stylesheet" href="./src/styles/entries/settings.scss" />
  <script type="module" src="./src/ts/settings.ts"></script>
</head>

<body>
  <main>
    <div class="title-wrapper">
      <h1 class="settings-title">Settings</h1>
      <div class="settings-decoration" aria-hidden="true"></div>
    </div>

    <div class="settings-content-wrapper">
      <form id="settings_form" class="settings-form">
        <section id="settings_selection" class="settings-selection">
          <p id="current_theme" class="current-theme">Code vibes theme</p>
          <div class="separator sep1" aria-hidden="true">
            <div class="diamond d-none" id="diamond-player" aria-hidden="true"></div>
          </div>
          <p id="current_player" class="current-player">Player</p>
          <div class="separator sep2" aria-hidden="true">
            <div class="diamond d-none" id="diamond-board" aria-hidden="true"></div>
          </div>
          <p id="current_board_size" class="current-size">Board size</p>
          <button type="submit" id="start_btn" disabled class="start-btn disabled-btn cursor-pointer">
            <!-- <img src="/assets/img/ui/smart_play.svg" alt="" /> -->
            <svg class="play-icon" width="20" height="16" viewBox="0 0 20 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M8.275 12L13.85 8.425C14 8.325 14.075 8.18333 14.075 8C14.075 7.81667 14 7.675 13.85 7.575L8.275 4C8.10833 3.88333 7.9375 3.875 7.7625 3.975C7.5875 4.075 7.5 4.225 7.5 4.425V11.575C7.5 11.775 7.5875 11.925 7.7625 12.025C7.9375 12.125 8.10833 12.1167 8.275 12ZM2 16C1.45 16 0.979167 15.8042 0.5875 15.4125C0.195833 15.0208 0 14.55 0 14V2C0 1.45 0.195833 0.979167 0.5875 0.5875C0.979167 0.195833 1.45 0 2 0H18C18.55 0 19.0208 0.195833 19.4125 0.5875C19.8042 0.979167 20 1.45 20 2V14C20 14.55 19.8042 15.0208 19.4125 15.4125C19.0208 15.8042 18.55 16 18 16H2ZM2 14H18V2H2V14Z"/>
            </svg>
            <span>Start</span>
          </button>
        </section>
      </form>
      <section id="settings_box" class="settings-box"></section>
      <section class="preview-wrapper">
        <img id="preview_img" src="/assets/img/ui/previews/codeVibes.svg" alt="" />
      </section>
    </div>
  </main>
</body>

</html>
