<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../src/scss/pages/_game.scss">
    <link rel="stylesheet" href="/public/assets/fonts/font.scss">
    <script type="module" src="../ts/game.ts"></script>
    <title>Game</title>
</head>

<body>
    <section>
        <header>
            <div class="player-points">
                <div class="player-blue">
                    <img src="/assets/img/ui/code_blue.svg" alt="Icon blue player">
                    Blue
                </div>
                <div class="player-orange">
                    <img src="/assets/img/ui/code_orange.svg" alt="Icon orange player">
                    Orange
                </div>
            </div>
            <div id="current_player" class="current-player-box">
                Current player:
            </div>
            <div class="exit">
                <img src="/assets/img/ui/exit.svg" alt="Exit icon">
                Exit game
            </div>
        </header>
        <div class="board"></div>
    </section>
</body>

</html>
