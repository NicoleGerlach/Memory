<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="./src/style.scss">
    <link rel="stylesheet" href="../../src/scss/pages/_settings.scss">
    <link rel="stylesheet" href="/public/assets/fonts/font.scss">
    <script type="module" src="../ts/settings.ts"></script>
</head>

<body>
    <section class="settings" id="settings">
        <div class="content">
            <h2 class="h2-settings">Settings</h2>
            <div class="settings-content">
                <div class="line-wrap">
                    <div class="diamond"></div>
                    <div class="line-big"></div>
                </div>
                <div id="settings_box"></div>
            </div>
            <div id="preview_box" class="preview-box">
            </div>
            <div class="selected-settings">
                <p>Game theme</p>
                <div class="ss-line-wrap">
                    <div class="ss-line"></div>
                    <div class="ss-diamond"></div>
                </div>
                <p>Player</p>
                <div class="ss-line-wrap">
                    <div class="ss-line"></div>
                    <div class="ss-diamond"></div>
                </div>
                <p>Board size</p>
                <button id="start_btn" class="start-btn" disabled>
                    <img src="/assets/img/ui/smart_play.svg" alt="small play icon">
                    Start
                </button>
            </div>
        </div>
    </section>
</body>

</html>
