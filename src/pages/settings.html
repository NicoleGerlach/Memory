<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="./src/style.scss">
    <link rel="stylesheet" href="../../src/scss/pages/_settings.scss">
    <link rel="stylesheet" href="/public/assets/fonts/font.scss">
    <script type="module" src="../ts/settings.ts"></script>
</head>

<body>
    <section class="settings" id="settings">
        <div class="content">
            <div class="settings-content">
                <h2 class="h2-settings">Settings</h2>
                <div class="line-wrap">
                    <div class="diamond"></div>
                    <div class="line-big"></div>
                </div>
                <div id="settings_box"></div>
            </div>
            <div class="preview-themes">
                <div class="preview-box">
                    <div class="preview-headline">
                        <p>Blue</p>
                        <p>Orange</p>
                        <div id="current_player">Current player:</div>
                        <button class="exit-btn">
                            <img src="../../public/assets/img/exit.svg">
                            Exit game
                    </div>
                    <div id="preview_game_theme" class="preview-game-theme"></div>
                </div>
                <div class="selected-settings">
                    <p>Game theme</p>
                    <div class="line"></div>
                    <p>Player</p>
                    <div class="line"></div>
                    <p>Board size</p>
                    <button>
                        <img src="../../public/assets/img/smart_play.svg" alt="small play icon">
                        Start
                    </button>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
