
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="./src/style.scss">
    <link rel="stylesheet" href="../../src/scss/pages/_settings.scss">
    <link rel="stylesheet" href="/public/assets/fonts/font.scss">
</head>
<body>
    <section class="settings" id="settings">
        <div class="content">
            <div class="settings-content">
                <h2 class="h2-settings">Settings</h2>
                <div class="line-wrap">
                    <div class="diamond"></div>
                    <div class="line-big"></div>
                </div>
                <div class="settings-box">
                    <div class="settings-box-headline">
                        <img src="../../public/assets/img/palette.svg" alt="">
                        <h3>Game themes</h3>
                    </div>
                    <form class="settings-box-inner">
                        <ul>
                            <li>
                                <input type="radio" name="themes" class="circle"></input>
                                <label>Default theme</label>
                            </li>
                            <li>
                                <input type="radio" name="themes" class="circle"></input>
                                <label>Dark theme</label>
                            </li>
                            <li>
                                <input type="radio" name="themes" class="circle"></input>
                                <label>Light theme</label>
                            </li>
                    </form>
                    <form class="settings-box-inner">
                    </form>
                </div>
                <div class="settings-box">
                    <div class="settings-box-headline">
                        <img src="../../public/assets/img/player.svg" alt="">
                        <h3>Choose player</h3>
                    </div>
                    <form class="settings-box-inner">
                        <ul>
                            <li>
                                <input type="radio" name="player" class="circle"></input>
                                <label>Blue</label>
                            </li>
                            <li>
                                <input type="radio" name="player" class="circle"></input>
                                <label>Orange</label>
                            </li>
                    </form>
                </div>
                <div class="settings-box">
                    <div class="settings-box-headline">
                        <img src="../../public/assets/img/board_size.svg" alt="">
                        <h3>Board size</h3>
                    </div>
                    <form class="settings-box-inner">
                        <ul>
                            <li>
                                <input type="radio" name="board" class="circle"></input>
                                <label>16 cards</label>
                            </li>
                            <li>
                                <input type="radio" name="board" class="circle"></input>
                                <label>24 card</label>
                            </li>
                            <li>
                                <input type="radio" name="board" class="circle"></input>
                                <label>36 cards</label>
                            </li>
                        </ul>
                    </form>
                </div>
            </div>
            <div class="preview-themes">
                <div class="preview-box">
                    <div class="preview-headline">
                        <p>Blue</p>
                        <p>Orange</p>
                        <div>Current player:</div>
                        <button>
                            <img src="../../public/assets/img/exit.svg">
                            Exit game
                    </div>
                    <div class="preview-game-theme"></div>
                </div>
                <div class="selected-settings">
                    <p>Game theme</p>
                    <div class="line"></div>
                    <p>Player</p>
                    <div class="line"></div>
                    <p>Board size</p>
                    <button>
                        <img src="../../public/assets/img/smart_play.svg" alt="small play icon">
                        Start
                    </button>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
