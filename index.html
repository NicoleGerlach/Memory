<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory</title>
    <link rel="stylesheet" href="./src/style.scss">
    <link rel="stylesheet" href="/public/assets/fonts/font.scss">
</head>

<body>
    <section class="home" id="home">
        <h2 class="h2-home">It's play time.</h2>
        <h1>Ready to play?</h1>
        <button class="button">
            <img class="button__controller" src="assets/img/controller.svg" alt="small picture of a controller">
            <p>Play</p>
            <img class="button__arrow" src="assets/img/arrow.svg" alt="arrow left">
        </button>
        <img class="controller-big" src="assets/img/controller-big.svg" alt="big picture of a controller" />
    </section>
    <section class="settings" id="settings">
        <div class="content">
            <h2 class="h2-settings">Settings</h2>
            <div class="settings-box">
                <h3>Game themes</h3>
                <div class="settings-box-inner">
                    <div class="circle"></div>
                    <p>Code vibes theme</p>
                </div>
                <div class="settings-box-inner">
                    <div class="circle"></div>
                    <p>Gaming theme</p>
                </div>
            </div>
            <div class="settings-box">
                <h3>Choose player</h3>
                <div class="settings-box-inner">
                    <div class="circle"></div>
                    <p>Blue</p>
                </div>
                <div class="settings-box-inner">
                    <div class="circle"></div>
                    <p>Orange</p>
                </div>
            </div>
            <div class="settings-box">
                <h3>Board size</h3>
                <div class="settings-box-inner">
                    <div class="circle"></div>
                    <p>16 cards</p>
                </div>
                <div class="settings-box-inner">
                    <div class="circle"></div>
                    <p>24 card</p>
                </div>
                <div class="settings-box-inner">
                    <div class="circle"></div>
                    <p>36 cards</p>
                </div>
            </div>
        </div>
        <div class="preview-themes">
            <div class="preview-box"></div>
        </div>
    </section>
</body>
<script src="./main.ts"></script>
</html>
