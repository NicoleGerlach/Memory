<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory</title>
  <link rel="stylesheet" crossorigin href="/assets/index-D-arIK-6.css">
</head>

<body>
    <section class="home" id="home">
        <h2 class="h2-home">It's play time.</h2>
        <h1>Ready to play?</h1>
        <button class="button">
            <img class="button__controller" src="assets/img/controller.svg" alt="small picture of a controller">
            <p>Play</p>
            <img class="button__arrow" src="assets/img/arrow.svg" alt="arrow left">
        </button>
        <img class="controller-big" src="assets/img/controller-big.svg" alt="big picture of a controller" />
    </section>
    <section class="settings" id="settings">
        <div class="content">
            <div class="settings-content">
                <h2 class="h2-settings">Settings</h2>
                <div class="line-wrap">
                    <div class="diamond"></div>
                    <div class="line-big"></div>
                </div>
                <div class="settings-box">
                    <div class="settings-box-headline">
                        <img src="assets/img/palette.svg" alt="">
                        <h3>Game themes</h3>
                    </div>
                    <div class="settings-box-inner">
                        <div class="circle"></div>
                        <p>Code vibes theme</p>
                    </div>
                    <div class="settings-box-inner">
                        <div class="circle"></div>
                        <p>Gaming theme</p>
                    </div>
                </div>
                <div class="settings-box">
                    <div class="settings-box-headline">
                        <img src="assets/img/player.svg" alt="">
                        <h3>Choose player</h3>
                    </div>
                    <div class="settings-box-inner">
                        <div class="circle"></div>
                        <p>Blue</p>
                    </div>
                    <div class="settings-box-inner">
                        <div class="circle"></div>
                        <p>Orange</p>
                    </div>
                </div>
                <div class="settings-box">
                    <div class="settings-box-headline">
                        <img src="assets/img/board_size.svg" alt="">
                        <h3>Board size</h3>
                    </div>
                    <div class="settings-box-inner">
                        <div class="circle"></div>
                        <p>16 cards</p>
                    </div>
                    <div class="settings-box-inner">
                        <div class="circle"></div>
                        <p>24 card</p>
                    </div>
                    <div class="settings-box-inner">
                        <div class="circle"></div>
                        <p>36 cards</p>
                    </div>
                </div>
            </div>
            <div class="preview-themes">
                <div class="preview-box">
                    <div class="preview-headline">
                        <p>Blue</p>
                        <p>Orange</p>
                        <div>Current player:</div>
                        <button>
                            <img src="">
                            Exit game
                    </div>
                    <div class="preview-game-theme"></div>
                </div>
                <div class="selected-settings">
                    <p>Game theme</p>
                    <div class="line"></div>
                    <p>Player</p>
                    <div class="line"></div>
                    <p>Board size</p>
                    <button>
                        <img src="assets/img/smart_play.svg" alt="small play icon">
                        Start
                    </button>
                </div>
            </div>
        </div>
    </section>
</body>
<script src="./main.ts"></script>

</html>
